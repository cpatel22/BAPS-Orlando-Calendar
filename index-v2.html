/* REMOTE: 0 = no usable hosted .ics, 1 = hosted as text/calendar, 2 = hosted but server sends the wrong type */
var REMOTE=0;
if(IOS){I.removeAttribute('download');
 if(URLICS&&HTTP&&window.fetch)fetch(URLICS.href,{cache:'no-store'}).then(function(r){if(!r.ok)return;var ct=(r.headers.get('content-type')||'').toLowerCase();return r.text().then(function(t){if(t.indexOf('BEGIN:VCALENDAR')<0)return;REMOTE=ct.indexOf('calendar')>-1?1:2;I.href=URLICS.href})}).catch(function(){})}
function webcal(){return'webcal://'+URLICS.host+URLICS.pathname+URLICS.search}
/* iOS only hands calendars to the Calendar app from the top window */
function nav(u){if(FRAMED){try{window.top.location.href=u;return}catch(x){}tip('Open this page directly in Safari (not inside another page or app), then tap Add to calendar.');return}location.href=u}
I.addEventListener('click',function(ev){
 if(IOS){ev.preventDefault();
  if(REMOTE){
   /* Safari + correct type: open the https .ics -> "Add All" sheet (keeps alerts).
      Other iOS browsers, in-app browsers, or wrong server type: webcal:// -> Calendar app */
   if(REMOTE==1&&!INAPP&&!IOSOTHER)nav(URLICS.href);else nav(webcal());
   return}
  if(INAPP||IOSOTHER){tip('To add these events to your iPhone Calendar, open this page in Safari (tap ••• or the Share button → Open in Safari), then tap Add to calendar.');return}
  /* Safari blocks data: URLs in the main window, so hand iOS a blob: URL built from the page's own events */
  try{var bu=BAPS.icsBlobUrl();nav(bu);setTimeout(function(){URL.revokeObjectURL(bu)},60000)}
  catch(x){tip('Could not open the calendar on this device.')}
  return}
 try{ev.preventDefault();BAPS.downloadIcs()}catch(x){}});
</script></body></html>
