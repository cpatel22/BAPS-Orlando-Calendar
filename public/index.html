 667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,
 556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
var MAP={'’':146,'‘':145,'“':147,'”':148,'–':150,'—':151,'•':149,'…':133};
function tw(s,sz,b){var w=0;Array.from(s).forEach(function(ch){var c=ch.charCodeAt(0);w+=(c>=32&&c<=126?AW[c-32]:556)});return w*sz/1000*(b?1.07:1)}
function enc(s){var o='';Array.from(s).forEach(function(ch){var c=MAP[ch]||ch.charCodeAt(0);if(c>255)c=63;
 if(c===40||c===41||c===92)o+='\\'+ch;else if(c<32||c>126)o+='\\'+('00'+c.toString(8)).slice(-3);else o+=ch});return'('+o+')'}
function f(n){return+n.toFixed(2)}
function rgb(h){h=h.replace('#','');return[0,2,4].map(function(i){return f(parseInt(h.substr(i,2),16)/255)}).join(' ')}
function wrap(s,sz,w){var out=[],ln='';s.split(/\s+/).forEach(function(wd){var t=ln?ln+' '+wd:wd;if(ln&&tw(t,sz)>w){out.push(ln);ln=wd}else ln=t});if(ln)out.push(ln);return out}

function makePdf(label,evs){
 var PW=612,PH=792,M=48,BOT=M+24,X={dot:M+7,date:M+16,time:M+108,ev:M+182,type:M+418},EVW=X.type-X.ev-12;
 var INK='#2f271c',HEAD='#5e4f39',MUT='#8a7a62',GOLD='#ebc58e',ALT='#fbf3e8',LINE='#e3ddd3';
 var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
 var pages=[],c='',y=0;
 function T(x,yy,s,sz,b,col){c+='BT /F'+(b?2:1)+' '+sz+' Tf '+rgb(col)+' rg '+f(x)+' '+f(yy)+' Td '+enc(s)+' Tj ET\n'}
 function R(x,yy,w,h,col){c+=rgb(col)+' rg '+f(x)+' '+f(yy)+' '+f(w)+' '+f(h)+' re f\n'}
 function L(x1,yy,x2,col,w){c+=rgb(col)+' RG '+w+' w '+f(x1)+' '+f(yy)+' m '+f(x2)+' '+f(yy)+' l S\n'}
 function D(cx,cy,r,col){var k=0.5523*r;c+=rgb(col)+' rg '+f(cx+r)+' '+f(cy)+' m '+f(cx+r)+' '+f(cy+k)+' '+f(cx+k)+' '+f(cy+r)+' '+f(cx)+' '+f(cy+r)+' c '+
  f(cx-k)+' '+f(cy+r)+' '+f(cx-r)+' '+f(cy+k)+' '+f(cx-r)+' '+f(cy)+' c '+f(cx-r)+' '+f(cy-k)+' '+f(cx-k)+' '+f(cy-r)+' '+f(cx)+' '+f(cy-r)+' c '+
  f(cx+k)+' '+f(cy-r)+' '+f(cx+r)+' '+f(cy-k)+' '+f(cx+r)+' '+f(cy)+' c f\n'}
 function colHead(){R(M,y-18,PW-2*M,18,'#f3ece2');[['DATE',X.date],['TIME',X.time],['EVENT',X.ev],['TYPE',X.type]].forEach(function(h){T(h[1],y-12.5,h[0],7.5,1,MUT)});y-=24}
 function newPage(){if(c)pages.push(c);c='';R(0,PH-6,PW,6,GOLD);
  if(!pages.length){y=PH-56;T(M,y,'BAPS Shri Swaminarayan Mandir · Orlando, FL',17,1,HEAD);
   y-=22;T(M,y,'Calendar '+CAL.year+' · '+label+' events',12.5,1,INK);
   y-=16;T(M,y,'1325 W Oak Ridge Rd, Orlando, FL 32809   ·   '+evs.length+' event'+(evs.length===1?'':'s')+', by date',9.5,0,MUT);y-=14}
  else{y=PH-40;T(M,y,CAL.title+' · '+label+' (continued)',10,1,MUT);y-=12}
  L(M,y,PW-M,LINE,0.8);y-=10;colHead()}
 newPage();
 if(!evs.length)T(M,y-14,'No events for this filter.',11,0,MUT);
 var lastM=0,alt=0;
 evs.forEach(function(e){var x=CAL.info(e),lines=wrap(e.name,10,EVW),h=Math.max(21,8+lines.length*13),need=h+(x.m!==lastM?26:0);
  if(y-need<BOT){newPage();lastM=0}
  if(x.m!==lastM){y-=4;T(M,y-12,MONTHS[x.m-1].toUpperCase(),10.5,1,HEAD);y-=20;L(M,y+3,PW-M,GOLD,1);lastM=x.m;alt=0}
  if(alt++%2)R(M,y-h,PW-2*M,h,ALT);
  var by=y-14;D(X.dot,by+3.4,3.2,x.t.color);
  T(X.date,by,x.lab,10,1,INK);
  T(X.time,by,e.start?(e.end?CAL.tl(e.start)+' – '+CAL.tl(e.end):x.tm):'All day',10,0,e.start?INK:MUT);
  lines.forEach(function(l,i){T(X.ev,by-i*13,l,10,0,INK)});
  T(X.type,by,e.type,9,0,MUT);
  y-=h});
 pages.push(c);
 var n=pages.length;pages=pages.map(function(p,i){c='';L(M,M+12,PW-M,LINE,0.6);T(M,M,'Dates are subject to change.',8.5,0,MUT);
  var pg='Page '+(i+1)+' of '+n;T(PW-M-tw(pg,8.5),M,pg,8.5,0,MUT);return p+c});
 // assemble
 var o=[],kids=[];o[1]='<< /Type /Catalog /Pages 2 0 R >>';
 o[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
 o[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
 o[5]='<< /Title '+enc(CAL.title+' - '+label)+' /Producer (BAPS Orlando Calendar) >>';
 pages.forEach(function(p,i){var a=6+i*2;kids.push(a+' 0 R');
  o[a]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(a+1)+' 0 R >>';
  o[a+1]='<< /Length '+p.length+' >>\nstream\n'+p+'endstream'});
 o[2]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>';
 var out='%PDF-1.4\n',off=[];
 for(var i=1;i<o.length;i++){off[i]=out.length;out+=i+' 0 obj\n'+o[i]+'\nendobj\n'}
 var xr=out.length;out+='xref\n0 '+o.length+'\n0000000000 65535 f \n';
 for(i=1;i<o.length;i++)out+=('000000000'+off[i]).slice(-10)+' 00000 n \n';
 return out+'trailer\n<< /Size '+o.length+' /Root 1 0 R /Info 5 0 R >>\nstartxref\n'+xr+'\n%%EOF\n'}
CAL.makePdf=makePdf;CAL.pickFilter=pick;

btn.addEventListener('click',function(){var k=cur();if(!k)return;
 var blob=new Blob([makePdf(F[k],pick(k))],{type:'application/pdf'}),u=URL.createObjectURL(blob),
  name=CAL.title+' - '+F[k].replace(/'/g,'')+'.pdf',ua=navigator.userAgent,
  ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 if(ios){location.href=u;return}
 var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(function(){URL.revokeObjectURL(u)},4000)});
})();

var b=document.createElement('button');b.textContent='💾 Save updated calendar';b.style.cssText='font:600 14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;padding:8px 12px;border:0;border-radius:8px;background:#c9a467;color:#fff;cursor:pointer';
box.appendChild(b);document.body.appendChild(box);
b.onclick=function(){var c=document.documentElement.cloneNode(true);
 var eb=c.querySelector('#edit-bar');if(eb)eb.remove();
 c.querySelector('#upl').innerHTML=CAL.upFirst;
 ['cur','curmo','today','hs'].forEach(function(k){[].forEach.call(c.querySelectorAll('.'+k),function(el){el.classList.remove(k);if(!el.className)el.removeAttribute('class')})});
 c.querySelector('#none').setAttribute('hidden','');var pb=c.querySelector('#pdfbar');if(pb)pb.setAttribute('hidden','');c.classList.remove('js');if(!c.className)c.removeAttribute('class');
 var blob=new Blob(['<!DOCTYPE html>'+c.outerHTML],{type:'text/html'}),u=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=u;a.download=CAL.title+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}})()}
